[project]
name = "phaengan-backend"
version = "0.1.0"
description = "แผนงาน – project scheduler backend (FastAPI, file-based JSON storage)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"app/features/settings/router.py" = ["E501"]  # Thai UI copy
